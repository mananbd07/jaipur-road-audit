name = "jaipur-road-audit"
main = "src/index.ts"
compatibility_date = "2026-01-01"

[[d1_databases]]
binding = "DB"
database_name = "jaipur-road-audit-db"
database_id = "6a71d3a4-d93b-4ae5-b6ab-cec3c694582d"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "jaipur-road-snapshots"

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]
